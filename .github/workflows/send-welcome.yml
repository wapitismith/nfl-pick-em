name: Send welcome email

on:
  workflow_dispatch:
    inputs:
      test_to:
        description: "Test mode: send ONE email to this address (leave blank to send to the full list)"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::jsonlite
            any::emayili
      - name: Send welcome emails
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_TO: ${{ inputs.test_to }}
          APP_URL: ${{ vars.APP_URL }}
        run: Rscript R/send_welcome.R
