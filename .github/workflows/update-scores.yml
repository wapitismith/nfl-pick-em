name: Live score updates

on:
  schedule:
    # Every 10 min during US game windows (cron is UTC).
    # Thu night: 00:00-04:50 UTC Fri (8:00pm-11:50pm ET Thu)
    - cron: "*/10 0-4 * * 5"
    # Sunday: 17:00-23:50 UTC (1:00pm ET onward)
    - cron: "*/10 17-23 * * 0"
    # Sunday night into Monday: 00:00-04:50 UTC Mon
    - cron: "*/10 0-4 * * 1"
    # Monday night: 00:00-04:50 UTC Tue
    - cron: "*/10 0-4 * * 2"
    # Sat games (late season) + Sun international windows: hourly safety net
    - cron: "0 14-23 * * 6"
  workflow_dispatch: {}

concurrency:
  group: update-scores
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::purrr
            any::jsonlite
            any::nflreadr
      - name: Update scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: Rscript R/update_scores.R
