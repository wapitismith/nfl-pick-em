name: Sync schedule (nflverse)

on:
  schedule:
    - cron: "0 10 * * *"   # daily 10:00 UTC (4am MT) — catches flexes AND short-notice moves
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank = current)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::jsonlite
            any::nflreadr
      - name: Sync schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEASON: ${{ inputs.season }}
        run: Rscript R/sync_schedule.R
