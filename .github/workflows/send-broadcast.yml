name: Send broadcast

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min — sends anything queued from Admin
  workflow_dispatch: {}      # or run manually for instant delivery

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::jsonlite
            any::emayili
      - name: Send queued broadcasts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: Rscript R/send_broadcast.R
