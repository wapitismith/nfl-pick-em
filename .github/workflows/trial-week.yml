name: Load trial week (preseason)

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "How many days of upcoming games to load (blank = 8)"
        required: false

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::purrr
            any::jsonlite
            any::nflreadr
      - name: Load upcoming games as week 0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS_AHEAD: ${{ inputs.days_ahead }}
        run: Rscript R/load_trial_week.R
