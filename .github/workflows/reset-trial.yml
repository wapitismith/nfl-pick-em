name: Reset trial week (Sept 1)

on:
  schedule:
    - cron: "0 12 1 9 *"   # Sept 1, 12:00 UTC (6am MT) — wipe week 0, fresh season
  workflow_dispatch: {}    # or run any time to clear week 0 immediately

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::jsonlite
            any::nflreadr
      - name: Delete week-0 games and picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: Rscript R/reset_trial.R
