name: Deploy web app to cPanel

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch: {}

env:
  DEST: /home/colomtnd/wapitismith/pickem   # wapitismith.com/pickem

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SEASON: "2026"
          VITE_VENMO_USER: ${{ vars.VENMO_USER }}
        run: |
          npm ci
          npm run build

      - name: Upload via cPanel API
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail

          # --- Normalize the host: accept https://, ports, paths, whitespace ---
          HOST=$(printf '%s' "$CPANEL_HOST" | tr -d '[:space:]' | sed -E 's#^[A-Za-z]+://##; s#[:/].*$##')
          if [ -z "$HOST" ]; then
            echo "::error::CPANEL_HOST secret is empty or unset"; exit 1
          fi
          echo "Deploying to host: $HOST (user: $CPANEL_USER)"

          # --- Preflight: can we even reach cPanel on port 2083? ---
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 "https://${HOST}:2083/" || echo FAIL)
          echo "Preflight https://${HOST}:2083 -> HTTP ${code}"
          if [ "$code" = "FAIL" ]; then
            echo "::error::Cannot reach ${HOST} on port 2083. The hostname is wrong or the server blocks outside API access. Try the exact hostname from your cPanel login URL."
            exit 1
          fi

          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          BASE="https://${HOST}:2083/execute"

          api() { # api <endpoint> <curl args...>
            local out
            out=$(curl -sS -H "$AUTH" "$BASE/$1" "${@:2}")
            if ! echo "$out" | grep -q '"status":1'; then
              echo "cPanel API response for $1: $out" >&2
              return 1
            fi
          }

          # Ensure target dirs exist ('already exists' errors are fine)
          api Fileman/mkdir --data-urlencode "path=/home/colomtnd/wapitismith" --data-urlencode "name=pickem" || true
          api Fileman/mkdir --data-urlencode "path=${DEST}" --data-urlencode "name=assets" || true

          cd web/dist
          # Upload everything at the dist root (index.html, logo, favicons, ...)
          for f in *; do
            if [ -f "$f" ]; then
              api Fileman/upload_files -F "dir=${DEST}" -F "overwrite=1" -F "file-1=@${f}"
              echo "uploaded ${f}"
            fi
          done
          i=1
          for f in assets/*; do
            api Fileman/upload_files -F "dir=${DEST}/assets" -F "overwrite=1" -F "file-${i}=@${f}"
            echo "uploaded ${f}"
            i=$((i+1))
          done
          echo "Deployed to https://wapitismith.com/pickem/"
